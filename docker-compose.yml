services:
  db:
    image: postgres:16-alpine
    container_name: loantrack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - loantrack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: loantrack-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - loantrack-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: loantrack-frontend
    ports:
      - "8080:8080"
    networks:
      - loantrack-net
    depends_on:
      - backend

networks:
  loantrack-net:
    driver: bridge

volumes:
  pgdata: